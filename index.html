<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>네온 핀볼 서바이벌</title>
<style>
:root{
  --bg:#07040f; --bg2:#13072a; --panel:#0d0819; --panel2:#160d2a;
  --neon:#ff3d7f; --neon2:#ff8a3d; --cyan:#35f0ff; --violet:#a66bff; --gold:#ffd54a;
  --text:#f4edff; --muted:#9c90bd; --line:rgba(255,61,127,.45);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  background-image:radial-gradient(900px 500px at 15% -10%,rgba(166,107,255,.18),transparent 60%),radial-gradient(800px 500px at 100% 110%,rgba(255,61,127,.16),transparent 60%);
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.screen{position:absolute;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:none}
.screen.active{display:flex}

/* ---------- 설정 화면 ---------- */
#setup{overflow-y:auto;justify-content:center;align-items:flex-start;padding:24px 16px}
.setup-card{
  width:min(760px,100%);margin:auto;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:18px;padding:26px;
  box-shadow:0 0 0 1px rgba(255,61,127,.15),0 0 40px rgba(255,61,127,.18),inset 0 0 40px rgba(166,107,255,.06);
}
h1{margin:0 0 4px;font-size:clamp(26px,5vw,38px);font-weight:900;letter-spacing:-.02em;
  color:#fff;text-shadow:0 0 8px var(--neon),0 0 24px var(--neon),0 0 48px rgba(255,61,127,.6)}
.sub{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}
label.t{display:block;font-weight:700;font-size:14px;margin:16px 0 6px;color:var(--cyan)}
textarea{
  width:100%;min-height:120px;resize:vertical;background:#09051411;background-color:#0a0614;color:var(--text);
  border:1px solid rgba(53,240,255,.4);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;line-height:1.6;
  box-shadow:inset 0 0 18px rgba(53,240,255,.08);
}
.add-row{display:flex;gap:8px;flex-wrap:wrap}
.add-row input{
  background:#0a0614;color:var(--text);border:1px solid rgba(166,107,255,.5);border-radius:10px;padding:10px 12px;font:inherit;min-width:0;
}
.add-row input[type=text]{flex:1 1 160px}
.add-row input[type=number]{width:90px}
.btn{
  border:1px solid var(--neon);background:rgba(255,61,127,.12);border-radius:10px;padding:10px 16px;font-weight:700;
  box-shadow:0 0 12px rgba(255,61,127,.35);transition:transform .12s,background .12s;
}
.btn:hover{background:rgba(255,61,127,.25)}
.btn:active{transform:scale(.97)}
.btn.ghost{border-color:rgba(156,144,189,.5);background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--text)}
.btn.cyan{border-color:var(--cyan);background:rgba(53,240,255,.1);box-shadow:0 0 12px rgba(53,240,255,.3)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:190px;overflow-y:auto;padding:2px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#0a0614;border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip b{color:var(--gold);font-weight:700}
.chip button{border:0;background:rgba(255,255,255,.1);border-radius:50%;width:20px;height:20px;line-height:1;padding:0;font-size:13px;color:var(--muted)}
.chip button:hover{background:var(--neon);color:#fff}
.summary{margin-top:10px;font-size:13px;color:var(--muted)}
.summary.warn{color:var(--neon2)}
.opt{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;color:var(--text)}
.opt input{width:18px;height:18px;accent-color:var(--neon)}
.start{
  width:100%;margin-top:20px;padding:16px;font-size:20px;font-weight:900;letter-spacing:.02em;border-radius:14px;
  border:1px solid var(--neon);background:linear-gradient(90deg,rgba(255,61,127,.35),rgba(255,138,61,.35));
  box-shadow:0 0 24px rgba(255,61,127,.5),inset 0 0 20px rgba(255,255,255,.06);text-shadow:0 0 10px rgba(255,255,255,.6);
}
.start:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

#title{user-select:none;-webkit-user-select:none;cursor:default;touch-action:manipulation}
.lvl{display:flex;gap:6px}
.lvl button{flex:1;padding:10px 0;border:1px solid rgba(53,240,255,.4);background:#0a0614;border-radius:10px;font-weight:900;font-size:16px;color:var(--muted)}
.lvl button.on{color:#fff;border-color:var(--cyan);background:rgba(53,240,255,.18);box-shadow:0 0 14px rgba(53,240,255,.4)}
.rig{margin:0;width:min(640px,100%);max-height:100%;overflow-y:auto;border:1px solid var(--violet);border-radius:14px;padding:16px;background:var(--panel2);box-shadow:0 0 30px rgba(166,107,255,.35)}
.rig-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,3,12,.85)}
.rig-modal[hidden]{display:none}
.rigdot{position:fixed;right:6px;bottom:calc(6px + env(safe-area-inset-bottom,0px));width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.04);z-index:20;padding:0;touch-action:manipulation;cursor:default}
.rig-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.rig-h .sp{flex:1}
.rig-h label{display:flex;gap:6px;align-items:center}
.rig-h .btn{padding:6px 12px;font-size:13px}
.rig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 12px;margin-top:10px}
.rig-row{display:grid;grid-template-columns:34px 1fr 56px;gap:6px;align-items:center;font-size:13px}
.rig-row input{background:#0a0614;color:var(--text);border:1px solid rgba(166,107,255,.45);border-radius:8px;padding:7px 9px;font:inherit;min-width:0}
.rig-row .rk{color:var(--gold);font-weight:800}
.rig-row .st{font-size:12px}
.rig-row .st.ok{color:#5dffa0}
.rig-row .st.bad{color:var(--neon)}
.rig-note{margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.5}

/* ---------- 게임 화면 ---------- */
#game{flex-direction:row;gap:14px;padding:12px}
.board-wrap{flex:1 1 auto;min-width:0;min-height:0;position:relative;display:flex;justify-content:center;align-items:center}
canvas{display:block;border-radius:14px;border:1px solid var(--line);box-shadow:0 0 30px rgba(255,61,127,.3),0 0 80px rgba(166,107,255,.15)}
#toast{
  position:absolute;left:50%;bottom:12%;transform:translate(-50%,10px);opacity:0;pointer-events:none;
  background:rgba(10,6,20,.88);border:1px solid var(--neon);border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px;
  box-shadow:0 0 18px rgba(255,61,127,.55);transition:opacity .2s,transform .2s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#pausedTag{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;
  font-size:clamp(28px,6vw,54px);font-weight:900;color:#fff;text-shadow:0 0 12px var(--cyan),0 0 36px var(--cyan);background:rgba(7,4,15,.45);border-radius:14px;
}
#pausedTag.on{display:flex}
.panel{
  width:min(390px,40%);flex:0 0 auto;display:flex;flex-direction:column;gap:10px;min-height:0;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px;
  box-shadow:0 0 30px rgba(255,61,127,.22),inset 0 0 30px rgba(255,61,127,.05);
}
.stat{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid rgba(255,61,127,.35);border-radius:10px;padding:8px 14px;background:rgba(255,61,127,.06)}
.stat .big{font-size:clamp(28px,4.4vw,44px);font-weight:900;line-height:1;color:#fff;text-shadow:0 0 10px var(--neon),0 0 26px var(--neon)}
.stat .lbl{font-size:12px;color:var(--muted);line-height:1.4;text-align:right}
.ctrl{display:flex;gap:8px;align-items:stretch}
#pauseBtn{
  flex:1;border:1px solid var(--neon);background:rgba(255,61,127,.14);border-radius:10px;padding:8px 10px;
  box-shadow:0 0 14px rgba(255,61,127,.5);font-weight:900;letter-spacing:.06em;line-height:1.15
}
#pauseBtn small{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.speed{display:flex;border:1px solid rgba(53,240,255,.5);border-radius:10px;overflow:hidden}
.speed button{border:0;background:transparent;padding:0 12px;font-weight:800;font-size:13px;color:var(--muted)}
.speed button.on{background:rgba(53,240,255,.2);color:var(--cyan)}
.homeBtn{border:1px solid rgba(156,144,189,.4);background:transparent;border-radius:10px;padding:0 12px;color:var(--muted);font-size:13px}
.homeBtn:hover{color:var(--text)}
.lb-head{display:grid;grid-template-columns:30px 1fr 78px 62px;gap:6px;font-size:11px;color:var(--muted);padding:0 8px}
.lb-head span:nth-child(n+3){text-align:right}
#lb{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:2px}
.row{
  display:grid;grid-template-columns:30px 1fr 78px 62px;gap:6px;align-items:center;padding:6px 8px;border-radius:8px;font-size:14px;
  border:1px solid rgba(255,255,255,.07);background-size:0% 100%;background-repeat:no-repeat;
}
.row .rk{font-weight:900;color:var(--muted);text-align:center}
.row .nm{display:flex;align-items:center;gap:7px;min-width:0}
.row .nm i{flex:0 0 9px;height:9px;border-radius:50%}
.row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ct{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.row .pc{text-align:right;font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:700}
.row.first{border-color:var(--gold);box-shadow:0 0 12px rgba(255,213,74,.35)}
.row.first .rk{color:var(--gold)}
.row.out{opacity:.38}
.row.out .pc{color:var(--muted)}
.foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:2px 6px}
.foot b{color:var(--cyan);font-variant-numeric:tabular-nums}

/* ---------- 결과 ---------- */
#result{
  position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(5,3,12,.82);backdrop-filter:blur(4px);
}
#result.on{display:flex}
.res-card{
  width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--gold);border-radius:18px;padding:20px;
  box-shadow:0 0 40px rgba(255,213,74,.35),0 0 90px rgba(255,61,127,.2);
}
.res-card h2{margin:0 0 4px;font-size:26px;text-align:center;color:var(--gold);text-shadow:0 0 14px rgba(255,213,74,.8)}
.res-card .win{text-align:center;font-size:30px;font-weight:900;margin:2px 0 12px;text-shadow:0 0 16px currentColor}
#resList{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.rr{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.08);font-size:15px}
.rr .rk{text-align:center;font-weight:900;color:var(--muted)}
.rr .nm{display:flex;align-items:center;gap:8px;min-width:0}
.rr .nm i{flex:0 0 10px;height:10px;border-radius:50%}
.rr .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .bl{color:var(--muted);font-size:13px}
.rr.r1{border-color:var(--gold);background:rgba(255,213,74,.1)}
.rr.r1 .rk{color:var(--gold)}
.rr.r2 .rk{color:#d9e2ff}.rr.r3 .rk{color:#ffb27a}
.res-actions{display:flex;gap:8px;margin-top:14px}
.res-actions .btn{flex:1}

@media (max-width:760px){
  #game{flex-direction:column;gap:10px;padding:8px}
  .panel{width:100%;height:42%;flex:0 0 auto}
  .stat .big{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- 설정 화면 -->
<section id="setup" class="screen active">
  <div class="setup-card">
    <h1 id="title">네온 핀볼 서바이벌</h1>
    <p class="sub">참가자마다 공을 나눠 갖고 핀볼 보드에 떨어뜨립니다. 공이 출구로 모두 빠져나간 참가자는 탈락하고, 가장 늦게까지 살아남은 사람이 1등입니다.</p>

    <label class="t" for="names">참가자 목록 (닉네임/공 개수)</label>
    <textarea id="names" placeholder="오정재/4, 잉누/2, 부르/20&#10;줄바꿈이나 쉼표로 구분해요. 개수를 생략하면 공 1개로 계산합니다."></textarea>

    <label class="t" for="addName">한 명씩 추가</label>
    <div class="add-row">
      <input id="addName" type="text" placeholder="닉네임" maxlength="20">
      <input id="addCount" type="number" min="1" max="99" value="1" aria-label="공 개수">
      <button class="btn cyan" id="addBtn" type="button">추가</button>
    </div>

    <div class="tools">
      <button class="btn ghost" id="sampleBtn" type="button">예시 불러오기</button>
      <button class="btn ghost" id="clearBtn" type="button">모두 지우기</button>
    </div>

    <div id="chips" aria-live="polite"></div>
    <div id="summary" class="summary"></div>

    <label class="t">맵 복잡도</label>
    <div class="lvl" id="lvl" role="group" aria-label="맵 복잡도">
      <button type="button" data-l="1" class="on">1</button>
      <button type="button" data-l="2">2</button>
      <button type="button" data-l="3">3</button>
      <button type="button" data-l="4">4</button>
      <button type="button" data-l="5">5</button>
    </div>
    <div class="summary" id="lvlHint">기본 맵</div>

    <label class="opt"><input type="checkbox" id="finishAll"> 한 명만 남아도 모든 공이 빠질 때까지 끝까지 진행</label>

    <div class="rig-modal" id="rigPanel" hidden>
    <div class="rig">
      <div class="rig-h"><b>순위 설정</b><label><input type="checkbox" id="rigOn"> 사용</label><span class="sp"></span><button type="button" class="btn ghost" id="rigClear">비우기</button><button type="button" class="btn ghost" id="rigHide">숨기기</button></div>
      <div class="rig-grid" id="rigGrid"></div>
      <datalist id="rigNames"></datalist>
      <p class="rig-note">비워 둔 순위는 자연스럽게 결정됩니다. 게임 화면에는 아무 표시도 나오지 않아요.</p>
    </div>
    </div>

    <button class="btn start" id="startBtn" type="button" disabled>게임 시작</button>
  </div>
</section>

<button class="rigdot" id="rigDot" type="button" tabindex="-1" aria-hidden="true"></button>

<!-- 게임 화면 -->
<section id="game" class="screen">
  <div class="board-wrap" id="boardWrap">
    <canvas id="cv"></canvas>
    <div id="pausedTag">PAUSED</div>
    <div id="toast"></div>
  </div>
  <aside class="panel">
    <div class="stat">
      <div class="big" id="aliveP">0</div>
      <div class="lbl">남은 참가자<br><span id="aliveBalls">0</span> / <span id="totalBalls">0</span> 공</div>
    </div>
    <div class="ctrl">
      <button id="pauseBtn" type="button">PAUSE<small>HOLD THE GAME</small></button>
      <div class="speed" role="group" aria-label="재생 속도">
        <button type="button" data-s="1" class="on">1x</button>
        <button type="button" data-s="2">2x</button>
        <button type="button" data-s="4">4x</button>
      </div>
      <button class="homeBtn" id="homeBtn" type="button">설정</button>
    </div>
    <div class="lb-head"><span>순위</span><span>닉네임</span><span>남은/전체</span><span>우승 확률</span></div>
    <div id="lb"></div>
    <div class="foot"><span>경과 시간</span><b id="clock">0:00</b></div>
  </aside>
  <div id="result">
    <div class="res-card">
      <h2>최종 결과</h2>
      <div class="win" id="winName"></div>
      <div id="resList"></div>
      <div class="res-actions">
        <button class="btn" id="againBtn" type="button">같은 멤버로 다시</button>
        <button class="btn ghost" id="backBtn" type="button">설정으로</button>
      </div>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function(){
"use strict";

/* ============ 공통 유틸 ============ */
const $ = id => document.getElementById(id);
const hue = i => (i * 137.508) % 360;
const colorOf = i => `hsl(${hue(i)} 95% 62%)`;

/* ============ 설정 화면 ============ */
const ta = $('names'), chips = $('chips'), summary = $('summary'), startBtn = $('startBtn');
const MAX_BALLS = 600;
let entries = [];

function parseEntries(text){
  const map = new Map();
  text.split(/[,\n，;]+/).forEach(tok=>{
    tok = tok.trim();
    if(!tok) return;
    let name = tok, count = 1;
    const m = tok.match(/^(.*?)\s*[\/:：]\s*(\d+)$/);
    if(m && m[1].trim()){ name = m[1].trim(); count = parseInt(m[2],10); }
    if(!count) return;
    map.set(name,(map.get(name)||0)+count);
  });
  return [...map].map(([name,count])=>({name,count}));
}

function renderSetup(){
  entries = parseEntries(ta.value);
  chips.innerHTML = '';
  entries.forEach((e,i)=>{
    const c = document.createElement('span'); c.className = 'chip';
    const dot = document.createElement('i'); dot.style.background = colorOf(i); dot.style.boxShadow = `0 0 8px ${colorOf(i)}`;
    const nm = document.createElement('span'); nm.textContent = e.name;
    const ct = document.createElement('b'); ct.textContent = '×' + e.count;
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', e.name + ' 삭제');
    x.onclick = ()=>{ entries.splice(i,1); ta.value = entries.map(v=>`${v.name}/${v.count}`).join(', '); renderSetup(); };
    c.append(dot,nm,ct,x); chips.appendChild(c);
  });
  const total = entries.reduce((s,e)=>s+e.count,0);
  summary.className = 'summary';
  if(entries.length < 2){
    summary.textContent = entries.length ? '참가자가 2명 이상 필요해요.' : '참가자를 입력하면 여기에 목록이 나타납니다.';
  } else if(total > MAX_BALLS){
    summary.textContent = `공이 ${total}개예요. 최대 ${MAX_BALLS}개까지 가능합니다.`; summary.classList.add('warn');
  } else {
    summary.textContent = `참가자 ${entries.length}명 · 공 ${total}개` + (total > 300 ? ' (공이 많으면 느려질 수 있어요)' : '');
  }
  startBtn.disabled = entries.length < 2 || total > MAX_BALLS;
  refreshRigUI();
}
ta.addEventListener('input', renderSetup);

$('addBtn').onclick = ()=>{
  const n = $('addName').value.trim().replace(/[,\/\n]/g,' ');
  const c = Math.max(1, Math.min(99, parseInt($('addCount').value,10) || 1));
  if(!n){ $('addName').focus(); return; }
  ta.value = (ta.value.trim() ? ta.value.trim().replace(/[,\s]+$/,'') + ', ' : '') + `${n}/${c}`;
  $('addName').value = ''; $('addCount').value = 1; $('addName').focus();
  renderSetup();
};
$('addName').addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); $('addBtn').click(); } });
$('sampleBtn').onclick = ()=>{

/* ============ 게임 상수 ============ */
const W = 600, H = 1000, R = 7, STEP = 1000/120, EXIT_Y = 962;
const cv = $('cv'), ctx = cv.getContext('2d');
const bg = document.createElement('canvas');
const wrap = $('boardWrap');

let Matter_ = window.Matter;
let engine, players, balls, bars, queue, elimOrder;
let simTime, spawnAcc, spawnInterval, stuckTimer, finishAll;
let paused = false, speed = 1, running = false, ended = false, rafId = 0, lastT = 0, acc = 0, lbTimer = 0;
let pegDefs = [], bumperDefs = [];
let cfg, mapLevel = 1;
let rigReserved = new Map(), rigOn = false;
let scale = 1, dpr = 1;

/* ============ 맵 복잡도 ============ */
function levelConfig(l){
  const bars = [
    { x:150, y:330, len:130, spd: 2.2 }, { x:450, y:330, len:130, spd:-2.2 },
    { x:300, y:565, len:190, spd: 1.7 }, { x:300, y:808, len:120, spd:-2.8 }
  ];
  const bumpers = [ {x:300,y:215,r:17}, {x:105,y:470,r:17}, {x:495,y:470,r:17}, {x:300,y:700,r:15},
    {x:150,y:820,r:14}, {x:450,y:820,r:14}, {x:300,y:895,r:11} ];
  let gap = 46, fg = 40;
  if(l >= 2){
    bars.push({x:90,y:690,len:90,spd:2.6},{x:510,y:690,len:90,spd:-2.6});
    bumpers.push({x:190,y:420,r:16},{x:410,y:420,r:16});
    gap = 42; fg = 38;
  }
  if(l >= 3){
    bars.push({x:300,y:125,len:110,spd:2.0},{x:190,y:750,len:90,spd:-3},{x:410,y:750,len:90,spd:3});
    bumpers.push({x:60,y:250,r:16},{x:540,y:250,r:16},{x:80,y:590,r:15},{x:520,y:590,r:15});
    bumpers.push({x:225,y:868,r:12},{x:375,y:868,r:12});
    gap = 38; fg = 36;
  }
  if(l >= 4){
    bars.push({x:80,y:150,len:90,spd:-2.4},{x:520,y:150,len:90,spd:2.4},{x:300,y:420,len:90,spd:-3.2});
    bumpers.push({x:200,y:215,r:16},{x:400,y:215,r:16});
    gap = 34; fg = 32;
  }
  if(l >= 5){
    bars.push({x:150,y:545,len:80,spd:3.0},{x:450,y:545,len:80,spd:-3.0},{x:300,y:285,len:90,spd:-2.6});
    bumpers.push({x:40,y:520,r:15},{x:560,y:520,r:15});
    gap = 30; fg = 30;
  }
  return { bars, bumpers, gap, fg };
}

/* ============ 순위 설정(비공개) 런타임 ============ */
function setupRig(){
  rigReserved = new Map(); rigOn = false;
  players.forEach(p=>{ p.rigRank = undefined; });
  if(!rigCfg.on) return;
  const N = players.length;
  rigCfg.names.forEach((nm,i)=>{
    const key = nm.trim().toLowerCase();
    if(!key) return;
    const r = i + 1;
    const p = players.find(q=>q.name.trim().toLowerCase() === key && q.rigRank === undefined);
    if(p && r <= N){ p.rigRank = r; rigReserved.set(N - r, p.id); }
  });
  rigOn = rigReserved.size > 0;
}
function canEliminate(p){
  if(!rigOn) return true;
  const owner = rigReserved.get(elimOrder.length);
  return owner !== undefined ? owner === p.id : p.rigRank === undefined;
}

/* ============ 월드 구성 ============ */
function buildWorld(){
  const { Engine, Bodies, Composite } = Matter_;
  cfg = levelConfig(mapLevel);
  engine = Engine.create();
  engine.gravity.y = 0.38;
  engine.positionIterations = 8;
  engine.velocityIterations = 6;
  const world = engine.world;
  const statics = [];
  const st = { isStatic:true, restitution:0.45, friction:0.02 };

  // 벽
  statics.push(Bodies.rectangle(-20, H/2, 40, 2600, st));
  statics.push(Bodies.rectangle(W+20, H/2, 40, 2600, st));

  // 깔때기
  const dx = W/2 - cfg.fg/2, dy = 80, len = Math.hypot(dx,dy), a = Math.atan2(dy,dx);
  statics.push(Bodies.rectangle(dx/2, 860+dy/2, len, 16, { ...st, angle:a }));
  statics.push(Bodies.rectangle(W-dx/2, 860+dy/2, len, 16, { ...st, angle:-a }));

  // 회전 장애물
  bars = cfg.bars.map(b=>{
    const body = Bodies.rectangle(b.x, b.y, b.len, 10, { ...st, restitution:0.6 });
    statics.push(body);
    return { body, len:b.len, spd:b.spd, x:b.x, y:b.y };
  });

  // 범퍼
  bumperDefs = cfg.bumpers;
  bumperDefs.forEach(b=> statics.push(Bodies.circle(b.x, b.y, b.r, { ...st, restitution:1.25 })));

  // 페그
  pegDefs = [];
  const gap = cfg.gap;
  let row = 0;
  for(let y = 125; y <= 790; y += gap, row++){
    const off = (row % 2) ? gap/2 : 0;
    for(let x = 23 + off; x <= W - 23; x += gap){
      if(bars.some(b => Math.hypot(b.x - x, b.y - y) < b.len/2 + 16)) continue;
      if(bumperDefs.some(b => Math.hypot(b.x - x, b.y - y) < b.r + 24)) continue;
      pegDefs.push({ x, y, row });
      statics.push(Bodies.circle(x, y, 5, st));
    }
  }
  Composite.add(world, statics);
  balls = [];
}

/* ============ 배경 레이어 (미리 그림) ============ */
function drawBg(k){
  bg.width = Math.round(W*k); bg.height = Math.round(H*k);
  const c = bg.getContext('2d');
  c.setTransform(k,0,0,k,0,0);
  const g = c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0620'); g.addColorStop(.6,'#12062b'); g.addColorStop(1,'#1d0722');
  c.fillStyle = g; c.fillRect(0,0,W,H);

  c.strokeStyle = 'rgba(166,107,255,.07)'; c.lineWidth = 1;
  for(let x=0;x<=W;x+=40){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
  for(let y=0;y<=H;y+=40){ c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }

  // 페그
  pegDefs.forEach(p=>{
    const col = `hsl(${(p.row*38 + p.x*0.25) % 360} 95% 62%)`;
    c.shadowColor = col; c.shadowBlur = 10; c.fillStyle = col;
    c.beginPath(); c.arc(p.x,p.y,4.5,0,Math.PI*2); c.fill();
    c.shadowBlur = 0; c.fillStyle = 'rgba(255,255,255,.75)';
    c.beginPath(); c.arc(p.x-1,p.y-1,1.6,0,Math.PI*2); c.fill();
  });
  // 범퍼
  bumperDefs.forEach(b=>{
    c.shadowColor = '#ff3d7f'; c.shadowBlur = 20;
    c.fillStyle = '#2a0a24'; c.strokeStyle = '#ff3d7f'; c.lineWidth = 3;
    c.beginPath(); c.arc(b.x,b.y,b.r,0,Math.PI*2); c.fill(); c.stroke();
    c.shadowBlur = 0; c.fillStyle = '#ff3d7f';
    c.beginPath(); c.arc(b.x,b.y,b.r*.4,0,Math.PI*2); c.fill();
  });
  // 깔때기 & 벽
  c.shadowColor = '#ff3d7f'; c.shadowBlur = 16; c.strokeStyle = '#ff3d7f'; c.lineWidth = 4; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0,860); c.lineTo(W/2-cfg.fg/2,940); c.stroke();
  c.beginPath(); c.moveTo(W,860); c.lineTo(W/2+cfg.fg/2,940); c.stroke();
  c.lineWidth = 3;
  c.beginPath(); c.moveTo(1.5,0); c.lineTo(1.5,860); c.stroke();
  c.beginPath(); c.moveTo(W-1.5,0); c.lineTo(W-1.5,860); c.stroke();
  // 출구 표시
  c.shadowColor = '#35f0ff'; c.shadowBlur = 14; c.strokeStyle = '#35f0ff'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(W/2-cfg.fg/2,EXIT_Y); c.lineTo(W/2+cfg.fg/2,EXIT_Y); c.stroke();
  c.shadowBlur = 8; c.fillStyle = '#35f0ff'; c.font = '700 14px sans-serif'; c.textAlign = 'center';
  c.fillText('EXIT', W/2, EXIT_Y + 24);
  c.beginPath(); c.moveTo(W/2-8,EXIT_Y+32); c.lineTo(W/2,EXIT_Y+40); c.lineTo(W/2+8,EXIT_Y+32); c.stroke();
  c.shadowBlur = 0;
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(!w || !h) return;
  scale = Math.min(w / W, h / H);
  const cssW = Math.floor(W*scale), cssH = Math.floor(H*scale);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  cv.width = Math.round(cssW*dpr); cv.height = Math.round(cssH*dpr);
  $('pausedTag').style.width = cssW + 'px'; $('pausedTag').style.height = cssH + 'px';
  $('pausedTag').style.left = ((w - cssW)/2) + 'px'; $('pausedTag').style.top = ((h - cssH)/2) + 'px';
  if(engine) drawBg(cv.width / W);
  if(engine) render();
}
if(window.ResizeObserver) new ResizeObserver(()=>{ if($('game').classList.contains('active')) resize(); }).observe(wrap);
window.addEventListener('resize', ()=>{ if($('game').classList.contains('active')) resize(); });

/* ============ 게임 시작 / 종료 ============ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id === id));
}

function startGame(){
  if(!Matter_){ alert('물리 엔진(Matter.js)을 불러오지 못했어요. 네트워크를 확인하고 새로고침해 주세요.'); return; }
  entries = parseEntries(ta.value);
  if(entries.length < 2) return;
  finishAll = $('finishAll').checked;
  players = entries.map((e,i)=>({ id:i, name:e.name, total:e.count, alive:e.count, color:colorOf(i), elimIdx:-1 }));
  queue = [];
  players.forEach(p=>{ for(let i=0;i<p.total;i++) queue.push(p.id); });
  for(let i = queue.length-1; i > 0; i--){ const j = (Math.random()*(i+1))|0; [queue[i],queue[j]] = [queue[j],queue[i]]; }
  elimOrder = [];
  setupRig();
  simTime = 0; spawnAcc = 0; stuckTimer = 0; acc = 0;
  spawnInterval = Math.max(35, Math.min(260, 9000 / queue.length));
  paused = false; ended = false; running = true;
  $('pauseBtn').firstChild.nodeValue = 'PAUSE'; $('pausedTag').classList.remove('on');
  $('result').classList.remove('on');
  $('totalBalls').textContent = queue.length;
  buildWorld();
  showScreen('game');
  resize();
  updateBoard(true);
  lastT = performance.now();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function stopGame(){
  running = false; cancelAnimationFrame(rafId);
}

/* ============ 시뮬레이션 ============ */
function spawnBall(){
  const { Bodies, Composite } = Matter_;
  const pid = queue.pop();
  const b = Bodies.circle(40 + Math.random()*(W-80), -15, R, {
    restitution:0.5, friction:0.01, frictionAir:0.008, density:0.002
  });
  b.plugin = { pid, px:b.position.x, py:b.position.y };
  Body_setV(b, (Math.random()-.5)*2, 1);
  Composite.add(engine.world, b);
  balls.push(b);
}
function Body_setV(b,x,y){ Matter_.Body.setVelocity(b,{x,y}); }

let toastTimer = 0;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function simStep(dt){
  const { Engine, Body, Composite } = Matter_;
  simTime += dt;
  spawnAcc += dt;
  while(queue.length && spawnAcc >= spawnInterval){ spawnAcc -= spawnInterval; spawnBall(); }
  bars.forEach(b => Body.setAngle(b.body, b.body.angle + b.spd*dt/1000));
  if(rigOn){
    const need = rigReserved.get(elimOrder.length);
    if(need !== undefined) balls.forEach(b=>{ if(b.plugin.pid === need) Body.applyForce(b, b.position, { x:0, y:b.mass*0.0007 }); });
  }
  Engine.update(engine, dt);

  // 출구 통과 처리
  for(let i = balls.length-1; i >= 0; i--){
    const b = balls[i];
    if(b.position.y > EXIT_Y || b.position.y > H+300 || b.position.x < -60 || b.position.x > W+60){
      const hp = players[b.plugin.pid];
      if(rigOn && hp.alive === 1 && !canEliminate(hp)){
        Body.setPosition(b, { x:W/2 + (Math.random()-.5)*60, y:EXIT_Y - 80 });
        Body.setVelocity(b, { x:(Math.random()-.5)*7, y:-7 - Math.random()*3 });
        continue;
      }
      Composite.remove(engine.world, b);
      balls.splice(i,1);
      const p = players[b.plugin.pid];
      p.alive--;
      if(p.alive === 0){
        p.elimIdx = elimOrder.length;
        elimOrder.push(p);
        toast(`${p.name} 탈락`);
      }
    }
  }
  // 끼인 공 풀어주기
  stuckTimer += dt;
  if(stuckTimer >= 1500){
    stuckTimer = 0;
    balls.forEach(b=>{
      const pl = b.plugin;
      if(Math.hypot(b.position.x-pl.px, b.position.y-pl.py) < 4 && b.position.y > 0){
        Body.setVelocity(b, { x:(Math.random()-.5)*8, y:-3 - Math.random()*3 });
      }
      pl.px = b.position.x; pl.py = b.position.y;
    });
  }
  // 종료 판정
  const aliveP = players.filter(p=>p.alive > 0);
  if(aliveP.length === 0 || (!finishAll && aliveP.length <= 1)){
    if(aliveP.length === 1){ aliveP[0].elimIdx = elimOrder.length; elimOrder.push(aliveP[0]); }
    endGame();
  }
}

function endGame(){
  ended = true; running = false;
  updateBoard(true); render();
  setTimeout(showResult, 700);
}

/* ============ 렌더링 ============ */
function render(){
  const k = cv.width / W;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  if(bg.width) ctx.drawImage(bg,0,0,cv.width,cv.height);
  ctx.setTransform(k,0,0,k,0,0);

  // 회전 바
  bars.forEach(b=>{
    ctx.save();
    ctx.translate(b.x,b.y); ctx.rotate(b.body.angle);
    ctx.shadowColor = '#ffd54a'; ctx.shadowBlur = 14;
    const g = ctx.createLinearGradient(-b.len/2,0,b.len/2,0);
    g.addColorStop(0,'#ff8a3d'); g.addColorStop(.5,'#ffd54a'); g.addColorStop(1,'#ff8a3d');
    ctx.fillStyle = g;
    ctx.fillRect(-b.len/2,-5,b.len,10);
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // 공
  const glow = balls.length <= 90;
  const labels = balls.length <= 45;
  balls.forEach(b=>{
    const p = players[b.plugin.pid], x = b.position.x, y = b.position.y;
    if(glow){ ctx.shadowColor = p.color; ctx.shadowBlur = 12; }
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(x-2,y-2,2,0,Math.PI*2); ctx.fill();
    if(labels){
      ctx.font = '700 11px sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(5,3,12,.9)'; ctx.strokeText(p.name, x, y-R-4);
      ctx.fillStyle = '#fff'; ctx.fillText(p.name, x, y-R-4);
    }
  });
}

/* ============ 현황판 ============ */
function sortedPlayers(){
  return players.slice().sort((a,b)=>{
    if((a.alive>0) !== (b.alive>0)) return a.alive>0 ? -1 : 1;
    if(a.alive>0) return (b.alive - a.alive) || (a.id - b.id);
    return b.elimIdx - a.elimIdx;
  });
}

function updateBoard(force){
  const totalAlive = players.reduce((s,p)=>s+p.alive,0);
  const aliveP = players.filter(p=>p.alive>0).length;
  $('aliveP').textContent = aliveP;
  $('aliveBalls').textContent = totalAlive;
  const s = Math.floor(simTime/1000);
  $('clock').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');

  const lb = $('lb');
  const list = sortedPlayers();
  // 행 재사용
  while(lb.children.length > list.length) lb.lastChild.remove();
  while(lb.children.length < list.length){
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<span class="rk"></span><span class="nm"><i></i><span></span></span><span class="ct"></span><span class="pc"></span>';
    lb.appendChild(r);
  }
  list.forEach((p,i)=>{
    const r = lb.children[i];
    const pct = totalAlive ? p.alive / totalAlive * 100 : 0;
    r.classList.toggle('first', i === 0 && p.alive > 0);
    r.classList.toggle('out', p.alive === 0);
    r.children[0].textContent = i+1;
    const dot = r.children[1].children[0];
    dot.style.background = p.color; dot.style.boxShadow = `0 0 7px ${p.color}`;
    r.children[1].children[1].textContent = p.name;
    r.children[2].textContent = p.alive + '/' + p.total;
    r.children[3].textContent = p.alive ? pct.toFixed(pct >= 10 ? 0 : 1) + '%' : '탈락';
    r.style.backgroundImage = p.alive ? `linear-gradient(90deg, ${p.color.replace('hsl(','hsla(').replace(')',' / .22)')}, transparent)` : 'none';
    r.style.backgroundSize = p.alive ? pct + '% 100%' : '0% 100%';
  });
}

/* ============ 메인 루프 ============ */
function loop(t){
  if(!running) return;
  const dt = Math.min(t - lastT, 50);
  lastT = t;
  if(!paused){
    acc += dt * speed;
    let n = 0;
    while(acc >= STEP && n < 40 && running){ simStep(STEP); acc -= STEP; n++; }
    if(n >= 40) acc = 0;
    lbTimer += dt;
    if(lbTimer > 100){ lbTimer = 0; if(running) updateBoard(); }
  }
  if(!ended) render();
  if(running) rafId = requestAnimationFrame(loop);
}

/* ============ 결과 화면 ============ */
function showResult(){
  const ranking = elimOrder.slice().reverse();
  const winner = ranking[0];
  const w = $('winName');
  w.textContent = '🏆 ' + winner.name;
  w.style.color = winner.color;
  const list = $('resList'); list.innerHTML = '';
  ranking.forEach((p,i)=>{
    const r = document.createElement('div');
    r.className = 'rr' + (i<3 ? ' r'+(i+1) : '');
    const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = i+1;
    const nm = document.createElement('span'); nm.className = 'nm';
    const dot = document.createElement('i'); dot.style.background = p.color; dot.style.boxShadow = `0 0 8px ${p.color}`;
    const name = document.createElement('span'); name.textContent = p.name;
    nm.append(dot,name);
    const bl = document.createElement('span'); bl.className = 'bl'; bl.textContent = `공 ${p.total}개`;
    r.append(rk,nm,bl); list.appendChild(r);
  });
  $('result').classList.add('on');
}

function setPaused(v){
  if(ended) return;
  paused = v;
  $('pauseBtn').firstChild.nodeValue = paused ? 'RESUME' : 'PAUSE';
  $('pausedTag').classList.toggle('on', paused);
}
$('pauseBtn').onclick = ()=> setPaused(!paused);
document.addEventListener('keydown', e=>{
  if(e.code === 'Space' && $('game').classList.contains('active') && !ended){ e.preventDefault(); setPaused(!paused); }
});

    document.querySelectorAll('.speed button').forEach(x=>x.classList.toggle('on', x === b));
  };
});

$('againBtn').onclick = ()=> startGame();

/* ---- 맵 복잡도 선택 ---- */
const LV_HINT = ['기본 맵','회전 막대와 범퍼가 늘어나고 핀이 조금 촘촘해져요','장애물이 더 늘고 출구가 좁아져요','장애물이 빽빽해지고 핀 간격이 더 좁아져요','최고 복잡도: 핀이 가장 촘촘하고 출구도 가장 좁아요'];
try{ const sv = parseInt(localStorage.getItem('pbLvlV1'),10); if(sv >= 1 && sv <= 5) mapLevel = sv; }catch(e){}
function paintLevel(){
  document.querySelectorAll('#lvl button').forEach(b=>b.classList.toggle('on', parseInt(b.dataset.l,10) === mapLevel));
  $('lvlHint').textContent = LV_HINT[mapLevel-1];
}
document.querySelectorAll('#lvl button').forEach(b=>{
  b.onclick = ()=>{
    mapLevel = parseInt(b.dataset.l,10);
    try{ localStorage.setItem('pbLvlV1', String(mapLevel)); }catch(e){}
    paintLevel();
  };
});
paintLevel();

/* ---- 비공개 순위 설정 ---- */
function loadRig(){
  try{
    const s = localStorage.getItem('pbRigV1');
    if(s){ const o = JSON.parse(s); return { on:!!o.on, names:Array.from({length:10},(_,i)=>String((o.names||[])[i]||'')) }; }
  }catch(e){}
  return { on:false, names:Array(10).fill('') };
}
function saveRig(){ try{ localStorage.setItem('pbRigV1', JSON.stringify(rigCfg)); }catch(e){} }
let rigCfg = loadRig();
const rigInputs = [], rigStatus = [];
for(let i = 0; i < 10; i++){
  const row = document.createElement('div'); row.className = 'rig-row';
  const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = (i+1) + '등';
  const inp = document.createElement('input'); inp.type = 'text'; inp.setAttribute('list','rigNames'); inp.autocomplete = 'off';
  inp.setAttribute('aria-label', (i+1) + '등 닉네임'); inp.value = rigCfg.names[i];
  const st = document.createElement('span'); st.className = 'st';
  inp.addEventListener('input', ()=>{ rigCfg.names[i] = inp.value; saveRig(); refreshRigUI(); });
  row.append(rk, inp, st); $('rigGrid').appendChild(row);
  rigInputs.push(inp); rigStatus.push(st);
}
$('rigOn').checked = rigCfg.on;
$('rigOn').onchange = ()=>{ rigCfg.on = $('rigOn').checked; saveRig(); };
$('rigClear').onclick = ()=>{ rigCfg.names = Array(10).fill(''); rigInputs.forEach(x=>{ x.value = ''; }); saveRig(); refreshRigUI(); };
$('rigHide').onclick = ()=>{ $('rigPanel').hidden = true; };
function refreshRigUI(){
  const dl = $('rigNames'); dl.innerHTML = '';
  entries.forEach(e=>{ const o = document.createElement('option'); o.value = e.name; dl.appendChild(o); });
  const names = entries.map(e=>e.name.trim().toLowerCase());
  const seen = new Set();
  rigInputs.forEach((inp,i)=>{
    const key = inp.value.trim().toLowerCase(), st = rigStatus[i];
    st.className = 'st'; st.textContent = '';
    if(!key) return;
    if(seen.has(key)){ st.textContent = '중복'; st.classList.add('bad'); return; }
    seen.add(key);
    if(!names.includes(key)){ st.textContent = '없음'; st.classList.add('bad'); }
    else if(i + 1 > entries.length){ st.textContent = '범위 밖'; st.classList.add('bad'); }
    else { st.textContent = '✓'; st.classList.add('ok'); }
  });
}
// 화면 오른쪽 아래 구석의 희미한 원을 2초 안에 3번 누르면 패널이 열립니다.
let dotTaps = [];
$('rigDot').addEventListener('click', ()=>{
  if(!$('setup').classList.contains('active')) return;
  const now = Date.now();
  dotTaps = dotTaps.filter(t=>now - t < 2000); dotTaps.push(now);
  if(dotTaps.length >= 3){ dotTaps = []; $('rigPanel').hidden = !$('rigPanel').hidden; }
});
$('rigPanel').addEventListener('click', e=>{ if(e.target === $('rigPanel')) $('rigPanel').hidden = true; });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') $('rigPanel').hidden = true; });
// 제목을 2.5초 안에 5번 누르면 패널이 열리고, 같은 방법으로 닫힙니다.
let titleTaps = [];
$('title').addEventListener('click', ()=>{
  const now = Date.now();
  titleTaps = titleTaps.filter(t=>now - t < 2500); titleTaps.push(now);
  if(titleTaps.length >= 5){
    titleTaps = [];
    const p = $('rigPanel'); p.hidden = !p.hidden;
    if(!p.hidden) p.scrollIntoView({ block:'nearest' });
  }
});

renderSetup();
})();
</script>
